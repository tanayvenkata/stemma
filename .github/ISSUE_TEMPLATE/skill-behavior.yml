name: Skill behavior
description: The skill did not trigger, read the wrong notes, or gave advice that made things worse.
labels: [skill-behavior]
body:
  - type: input
    id: agent
    attributes:
      label: Agent and model
      description: e.g. Claude Code with Sonnet, Codex
    validations:
      required: true
  - type: textarea
    id: prompt
    attributes:
      label: What you asked
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened, and what you expected
      description: Include which notes it read if you can see them.
    validations:
      required: true
